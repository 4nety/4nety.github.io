<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Algorithm Experience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/png" sizes="32x32" href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      overscroll-behavior: none;
      touch-action: none;
    }

    html, body {
      overscroll-behavior: none;
    }

    /* Initial screen with Instagram logo */
    .initial-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .fa-instagram {
      transform: scale(1.7);
    }

    .instagram-icon {
      width: 120px;
      height: 120px;
      background: #d6249f;
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .instagram-icon:hover { transform: scale(1.1); }
    .instagram-icon:active { transform: scale(0.90); }
    .instagram-icon i { color: white; font-size: 60px; }

    .click-instruction {
      margin-top: 30px;
      color: #8e8e8e;
      font-size: 16px;
      text-align: center;
    }

    /* Camera access request screen */
    .camera-permission-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000;
      color: white;
      z-index: 90;
      text-align: center;
      padding: 20px;
    }

    .camera-icon {
      font-size: 80px;
      margin-bottom: 30px;
    }

    .permission-text {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      max-width: 500px;
    }

    .permission-instruction {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 40px;
      max-width: 500px;
    }

    .allow-btn {
      background-color: #0095f6;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .allow-btn:hover { background-color: #0081d6; }

    /* Main experience container */
    .experience {
      position: fixed;
      inset: 0;
      display: none;
      background: #000;
      z-index: 80;
      overflow: hidden;
    }

    /* Reel panels (two, for crossfade swipe) */
    .reel-panel {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .reel-panel video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Camera feed video - mirrored */
    .reel-panel video.camera-video {
      transform: scaleX(-1);
    }

    /* Instagram UI overlay */
    .ig-overlay {
      position: fixed;
      inset: 0;
      z-index: 85;
      pointer-events: none;
      display: none;
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 50px 15px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .username {
      font-weight: 600;
      font-size: 15px;
    }

    .verified-badge {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .verified-badge svg {
      width: 16px;
      height: 16px;
    }

    .verified-badge.hidden {
      display: none;
    }

    .follow-btn {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      color: white;
    }

    /* Right action buttons */
    .action-buttons {
      position: absolute;
      right: 12px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .action-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: white;
    }

    .action-button i {
      font-size: 28px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .action-button .count {
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }

    /* Bottom info */
    .bottom-info {
      position: absolute;
      bottom: 30px;
      left: 15px;
      right: 80px;
      color: white;
    }

    .bottom-handle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }

    .bottom-caption {
      font-size: 13px;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      opacity: 0.9;
    }

    .music-info {
      display: flex;
      align-items: center;
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.7;
    }

    .music-info i { margin-right: 6px; font-size: 11px; }

    /* Swipe hint */
    .swipe-hint {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      animation: hintPulse 2s infinite;
      pointer-events: none;
    }

    @keyframes hintPulse {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-5px); opacity: 0.9; }
    }

    /* Progress bar at top */
    .progress-dots {
      position: absolute;
      top: 30px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 0 15px;
      z-index: 5;
    }

    .progress-dot {
      flex: 1;
      max-width: 60px;
      height: 2px;
      background: rgba(255,255,255,0.3);
      border-radius: 1px;
    }

    .progress-dot.active { background: #fff; }
  </style>
</head>

<body>
  <!-- Initial screen -->
  <div class="initial-screen" id="initialScreen">
    <div class="instagram-icon" id="instagramIcon">
      <i class="fab fa-instagram"></i>
    </div>
    <p class="click-instruction">Click on the Instagram icon to begin.</p>
  </div>

  <!-- Camera permission screen -->
  <div class="camera-permission-screen" id="cameraPermissionScreen">
    <div class="camera-icon"><i class="fas fa-camera"></i></div>
    <h1 class="permission-text">Instagram needs access to your camera</h1>
    <p class="permission-instruction">To continue the experience, please allow access to your camera.</p>
    <button class="allow-btn" id="allowCameraBtn">Allow Camera Access</button>
  </div>

  <!-- Main experience -->
  <div class="experience" id="experience">
    <!-- Two reel panels for swipe animations -->
    <div class="reel-panel" id="reelA" style="transform: translateY(0)">
      <video id="videoA" playsinline muted autoplay loop></video>
    </div>
    <div class="reel-panel" id="reelB" style="transform: translateY(100%)">
      <video id="videoB" playsinline muted autoplay loop></video>
    </div>
  </div>

  <!-- Instagram UI overlay -->
  <div class="ig-overlay" id="igOverlay">
    <div class="progress-dots" id="progressDots"></div>

    <div class="top-bar">
      <div class="username-row">
        <span class="username" id="topUsername">@user</span>
        <span class="verified-badge" id="topVerified">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#3897f0" d="M23 12l-2.44-2.78.34-3.68-3.61-.82-1.89-3.18L12 3 8.6 1.54 6.71 4.72l-3.61.81.34 3.68L1 12l2.44 2.78-.34 3.69 3.61.82 1.89 3.18L12 21l3.4 1.46 1.89-3.18 3.61-.82-.34-3.68L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/>
          </svg>
        </span>
      </div>
      <div class="follow-btn" id="followBtn">Follow</div>
    </div>

    <div class="action-buttons">
      <div class="action-button">
        <i class="far fa-heart"></i>
        <div class="count" id="likeCount">0</div>
      </div>
      <div class="action-button">
        <i class="far fa-comment" style="transform: scaleX(-1)"></i>
        <div class="count" id="commentCount">0</div>
      </div>
      <div class="action-button">
        <i class="far fa-paper-plane"></i>
        <div class="count" id="shareCount">0</div>
      </div>
      <div class="action-button">
        <i class="far fa-bookmark"></i>
      </div>
      <div class="action-button">
        <i class="fas fa-ellipsis-h" style="font-size: 20px"></i>
      </div>
    </div>

    <div class="bottom-info">
      <div class="bottom-handle">
        <span id="bottomUsername">@user</span>
        <span class="verified-badge" id="bottomVerified">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#3897f0" d="M23 12l-2.44-2.78.34-3.68-3.61-.82-1.89-3.18L12 3 8.6 1.54 6.71 4.72l-3.61.81.34 3.68L1 12l2.44 2.78-.34 3.69 3.61.82 1.89 3.18L12 21l3.4 1.46 1.89-3.18 3.61-.82-.34-3.68L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/>
          </svg>
        </span>
      </div>
      <div class="bottom-caption" id="bottomCaption"></div>
      <div class="music-info" id="musicInfo"><i class="fas fa-music"></i> <span>Original audio</span></div>
    </div>

    <div class="swipe-hint" id="swipeHint">swipe up</div>
  </div>

  <script>
    // === CONFIG: reels sequence ===
    // Each reel is either a video file or a camera feed
    // Pattern: 3 videos → camera → video → camera → video → camera ...
    // Change the video filenames to match what you upload to the /videos folder
    const reels = [
      { type: 'video', src: 'videos/video1.mp4', username: '@anna.m', caption: 'just vibing ✨', likes: '284K', comments: '12.4K', shares: '8.2K', verified: true },
      { type: 'video', src: 'videos/video2.mp4', username: '@marko_k', caption: 'can\'t stop watching', likes: '1.2M', comments: '45K', shares: '22K', verified: true },
      { type: 'video', src: 'videos/video3.mp4', username: '@sofi.j', caption: 'another hour gone', likes: '892K', comments: '31K', shares: '15K', verified: true },
      { type: 'camera' },
      { type: 'video', src: 'videos/video4.mp4', username: '@luka.r', caption: 'pov: it\'s 3am', likes: '523K', comments: '19K', shares: '9.8K', verified: true },
    ];

    // === DOM elements ===
    const initialScreen = document.getElementById('initialScreen');
    const instagramIcon = document.getElementById('instagramIcon');
    const cameraPermissionScreen = document.getElementById('cameraPermissionScreen');
    const allowCameraBtn = document.getElementById('allowCameraBtn');
    const experience = document.getElementById('experience');
    const igOverlay = document.getElementById('igOverlay');

    const reelA = document.getElementById('reelA');
    const reelB = document.getElementById('reelB');
    const videoA = document.getElementById('videoA');
    const videoB = document.getElementById('videoB');

    // UI elements
    const topUsername = document.getElementById('topUsername');
    const topVerified = document.getElementById('topVerified');
    const bottomUsername = document.getElementById('bottomUsername');
    const bottomVerified = document.getElementById('bottomVerified');
    const bottomCaption = document.getElementById('bottomCaption');
    const followBtn = document.getElementById('followBtn');
    const likeCount = document.getElementById('likeCount');
    const commentCount = document.getElementById('commentCount');
    const shareCount = document.getElementById('shareCount');
    const progressDotsEl = document.getElementById('progressDots');
    const swipeHint = document.getElementById('swipeHint');

    // === State ===
    let currentIndex = 0;
    let activeReel = reelA;
    let nextReel = reelB;
    let activeVideo = videoA;
    let nextVideo = videoB;
    let cameraStream = null;
    let isAnimating = false;

    // === Init progress dots ===
    for (let i = 0; i < reels.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'progress-dot';
      if (i === 0) dot.classList.add('active');
      progressDotsEl.appendChild(dot);
    }

    function updateProgressDots(idx) {
      const dots = document.querySelectorAll('.progress-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === idx);
      });
    }

    // === Load a reel onto a video element ===
    async function loadReelTo(videoEl, idx) {
      const reel = reels[idx];

      if (reel.type === 'video') {
        // Remove camera class, set src, play
        videoEl.classList.remove('camera-video');
        videoEl.srcObject = null;
        videoEl.src = reel.src;
        videoEl.muted = true;
        videoEl.loop = true;
        videoEl.play().catch(function() {});
      } else if (reel.type === 'camera') {
        // Use camera stream
        videoEl.classList.add('camera-video');
        videoEl.src = '';
        videoEl.srcObject = cameraStream;
        videoEl.muted = true;
        videoEl.play().catch(function() {});
      }
    }

    // === Update Instagram UI for a given reel ===
    function updateUI(idx) {
      const reel = reels[idx];
      updateProgressDots(idx);

      if (reel.type === 'video') {
        topUsername.textContent = reel.username;
        bottomUsername.textContent = reel.username;
        bottomCaption.textContent = reel.caption || '';
        followBtn.style.display = '';
        likeCount.textContent = reel.likes;
        commentCount.textContent = reel.comments;
        shareCount.textContent = reel.shares;
        if (reel.verified) {
          topVerified.classList.remove('hidden');
          bottomVerified.classList.remove('hidden');
        } else {
          topVerified.classList.add('hidden');
          bottomVerified.classList.add('hidden');
        }
      } else if (reel.type === 'camera') {
        topUsername.textContent = '@you';
        bottomUsername.textContent = '@you';
        bottomCaption.textContent = '';
        followBtn.style.display = 'none';
        likeCount.textContent = '0';
        commentCount.textContent = '0';
        shareCount.textContent = '0';
        topVerified.classList.add('hidden');
        bottomVerified.classList.add('hidden');
      }
    }

    // === Swipe to next ===
    async function swipeNext() {
      if (isAnimating) return;
      if (currentIndex >= reels.length - 1) return;

      isAnimating = true;
      swipeHint.style.opacity = '0';

      const nextIdx = currentIndex + 1;

      // Load next reel into the offscreen video
      await loadReelTo(nextVideo, nextIdx);

      // Animate
      nextReel.style.transition = 'none';
      nextReel.style.transform = 'translateY(100%)';
      void nextReel.offsetHeight;

      nextReel.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
      activeReel.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
      nextReel.style.transform = 'translateY(0)';
      activeReel.style.transform = 'translateY(-100%)';

      setTimeout(() => {
        // Swap
        const tmpReel = activeReel;
        const tmpVideo = activeVideo;
        activeReel = nextReel;
        activeVideo = nextVideo;
        nextReel = tmpReel;
        nextVideo = tmpVideo;

        // Pause the now-offscreen video to save resources
        nextVideo.pause();

        // Reset offscreen position
        nextReel.style.transition = 'none';
        nextReel.style.transform = 'translateY(100%)';
        void nextReel.offsetHeight;

        currentIndex = nextIdx;
        updateUI(currentIndex);
        isAnimating = false;
      }, 480);
    }

    // === Swipe to previous ===
    async function swipePrev() {
      if (isAnimating) return;
      if (currentIndex <= 0) return;

      isAnimating = true;
      const prevIdx = currentIndex - 1;

      await loadReelTo(nextVideo, prevIdx);

      nextReel.style.transition = 'none';
      nextReel.style.transform = 'translateY(-100%)';
      void nextReel.offsetHeight;

      nextReel.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
      activeReel.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
      nextReel.style.transform = 'translateY(0)';
      activeReel.style.transform = 'translateY(100%)';

      setTimeout(() => {
        const tmpReel = activeReel;
        const tmpVideo = activeVideo;
        activeReel = nextReel;
        activeVideo = nextVideo;
        nextReel = tmpReel;
        nextVideo = tmpVideo;

        nextVideo.pause();

        nextReel.style.transition = 'none';
        nextReel.style.transform = 'translateY(100%)';
        void nextReel.offsetHeight;

        currentIndex = prevIdx;
        updateUI(currentIndex);
        isAnimating = false;
      }, 480);
    }

    // === Swipe handlers ===
    function setupSwipe() {
      let startY = 0;
      let endY = 0;
      let dragging = false;

      document.addEventListener('touchstart', (e) => {
        if (isAnimating) return;
        startY = e.touches[0].clientY;
        endY = startY;
        dragging = true;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!dragging || isAnimating) return;
        endY = e.touches[0].clientY;
      }, { passive: false });

      document.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        const diff = startY - endY;
        if (diff > 50) swipeNext();
        else if (diff < -50) swipePrev();
      });

      let mouseDown = false;
      document.addEventListener('mousedown', (e) => {
        if (isAnimating) return;
        mouseDown = true;
        startY = e.clientY;
        endY = startY;
      });
      document.addEventListener('mousemove', (e) => {
        if (!mouseDown) return;
        endY = e.clientY;
      });
      document.addEventListener('mouseup', () => {
        if (!mouseDown) return;
        mouseDown = false;
        const diff = startY - endY;
        if (diff > 50) swipeNext();
        else if (diff < -50) swipePrev();
      });

      let wheelLocked = false;
      document.addEventListener('wheel', (e) => {
        if (wheelLocked || isAnimating) return;
        if (e.deltaY > 30) {
          wheelLocked = true;
          swipeNext();
          setTimeout(() => { wheelLocked = false; }, 600);
        } else if (e.deltaY < -30) {
          wheelLocked = true;
          swipePrev();
          setTimeout(() => { wheelLocked = false; }, 600);
        }
      }, { passive: true });
    }

    // === Camera access ===
    function requestCameraAccess() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Your browser doesn't support camera access.");
        startExperience();
        return;
      }

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
      }).then((stream) => {
        cameraStream = stream;
        startExperience();
      }).catch((err) => {
        console.error("Camera access error:", err);
        alert("Unable to access camera. Please allow camera access to continue.");
      });
    }

    // === Start experience ===
    async function startExperience() {
      cameraPermissionScreen.style.display = 'none';
      experience.style.display = 'block';
      igOverlay.style.display = 'block';

      // Load first reel
      await loadReelTo(activeVideo, 0);
      updateUI(0);

      setupSwipe();
    }

    // === Event listeners ===
    instagramIcon.addEventListener('click', () => {
      initialScreen.style.opacity = '0';
      setTimeout(() => {
        initialScreen.style.display = 'none';
        cameraPermissionScreen.style.display = 'flex';
      }, 500);
    });

    allowCameraBtn.addEventListener('click', requestCameraAccess);
  </script>
</body>
</html>
